name: Marketplace CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python3 -m unittest discover -s tests -q
      # The mirror carries release bytes verbatim, and upstream release ZIPs may
      # legitimately contain CRLF files, so CR before EOL is not whitespace damage
      # here; the check still rejects trailing spaces/tabs and other damage.
      - run: git -c core.whitespace=cr-at-eol diff --check
