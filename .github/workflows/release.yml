name: Publish marketplace release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python3 -m unittest discover -s tests -q
      - name: Verify tag matches release index
        run: test "$(python3 -c 'import json; print(json.load(open("release-index.json"))["tag"])')" = "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" release-index.json --verify-tag --generate-notes --title "Portable Resume marketplace $GITHUB_REF_NAME"
          fi
